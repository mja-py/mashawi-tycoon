<!-- Shopify: Online Store > Pages > (your page) > Add section > "Custom Liquid", paste everything below.
     Replace GAME_URL with your GitHub Pages address (keep the trailing slash). -->
<div class="mt-game" data-url="GAME_URL">
  <div class="mt-cover" style="background-image:url(GAME_URLcover.jpg)">
    <a class="mt-play" href="GAME_URL" target="_blank" rel="noopener">▶ العب / Play</a>
  </div>
</div>
<style>
.mt-game{position:relative;width:100%;aspect-ratio:16/9;max-width:1280px;margin:0 auto;background:#3e2210;border-radius:12px;overflow:hidden}
.mt-cover{position:absolute;inset:0;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center}
.mt-play{padding:16px 32px;border-radius:12px;background:#4a9f4f;color:#fff7e8;font:700 22px/1 sans-serif;text-decoration:none;box-shadow:0 4px 0 #2f7a35}
.mt-game iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media (max-width:767px){.mt-game{aspect-ratio:16/10}}
</style>
<script>
(function(){
  var g=document.querySelector('.mt-game'),a=g.querySelector('.mt-play');
  a.addEventListener('click',function(e){
    // phones: open the game page full-screen in a new tab (iPhone has no element fullscreen)
    if(window.matchMedia('(max-width:767px)').matches)return;
    // desktop: load the game inline, only after the click (no 15 MB download on page view)
    e.preventDefault();
    var f=document.createElement('iframe');f.src=g.dataset.url;f.allow='fullscreen; autoplay';
    f.setAttribute('allowfullscreen','');f.loading='eager';g.innerHTML='';g.appendChild(f);
  });
})();
</script>
